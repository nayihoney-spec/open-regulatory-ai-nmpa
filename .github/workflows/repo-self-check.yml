name: Repository safety check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile safety checker
        run: python3 -m py_compile tools/repo_self_check.py
      - name: Run repository and skill validation
        run: python3 tools/repo_self_check.py .
